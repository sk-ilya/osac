---
name: CaaS integration repetitions
run-name: CaaS IT ${{ inputs.iteration }}/100 · 101616e5f

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      iteration:
        description: Repetition number
        required: true
        type: string

permissions:
  contents: read

jobs:
  caas:
    uses: ./.github/workflows/tests.yml
    with:
      kind: it-caas
      commit: 101616e5f1d6b581b9fb267dc1c661ef901c695c
      timeout: 120
      artifact_suffix: -repeat-${{ inputs.iteration }}
