---
name: CaaS integration repetitions
run-name: CaaS IT ${{ inputs.iteration }}/100 · 322e8d68b

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      iteration:
        description: Repetition number
        required: true
        type: string

permissions:
  contents: read

jobs:
  caas:
    uses: ./.github/workflows/tests.yml
    with:
      kind: it-caas
      commit: 322e8d68b96e54dd8c759e824a48379372f934e3
      timeout: 120
      artifact_suffix: -repeat-${{ inputs.iteration }}
