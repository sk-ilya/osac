---
name: CaaS integration repetitions
run-name: CaaS IT ${{ inputs.iteration }}/100 · ad2f71cfc

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      iteration:
        description: Repetition number
        required: true
        type: string

permissions:
  contents: read

jobs:
  caas:
    uses: ./.github/workflows/tests.yml
    with:
      kind: it-caas
      commit: ad2f71cfc770041ca98a79684104350ba3b54930
      timeout: 120
      artifact_suffix: -repeat-${{ inputs.iteration }}
