---
name: CaaS integration repetitions
run-name: CaaS IT ${{ inputs.iteration }}/100 · 0231c5500

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      iteration:
        description: Repetition number
        required: true
        type: string

permissions:
  contents: read

jobs:
  caas:
    uses: ./.github/workflows/tests.yml
    with:
      kind: it-caas
      commit: 0231c550086d10c131dd14e9f56f05fa62306a27
      timeout: 120
      artifact_suffix: -repeat-${{ inputs.iteration }}
