---
name: CaaS integration repetitions
run-name: CaaS IT ${{ inputs.iteration }}/100 · 4fe1ea16f

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      iteration:
        description: Repetition number
        required: true
        type: string

permissions:
  contents: read

jobs:
  caas:
    uses: ./.github/workflows/tests.yml
    with:
      kind: it-caas
      commit: 4fe1ea16f921d6f69b90303744441897c6a4c809
      timeout: 120
      artifact_suffix: -repeat-${{ inputs.iteration }}
