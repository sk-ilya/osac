---
name: CaaS integration repetitions
run-name: CaaS IT ${{ inputs.iteration }}/100 · f7b8cd8c8

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      iteration:
        description: Repetition number
        required: true
        type: string

permissions:
  contents: read

jobs:
  caas:
    uses: ./.github/workflows/tests.yml
    with:
      kind: it-caas
      commit: f7b8cd8c825f88dfbcfe86e73c21dd3771b1d353
      timeout: 120
      artifact_suffix: -repeat-${{ inputs.iteration }}
